    policy_snapshot_id: "sha256-479109e8c4efbcec"
    enabled: true
    disable_reason: null
    checked_at: "2026-10-27T22:55:00Z"
    requests_per_minute: 600
    official_doc_urls:
      - "https://docs.openalex.org/how-to-use-the-api/rate-limits-and-authentication"
      - "https://help.openalex.org/api/authentication.md"
      - "https://help.openalex.org/access/pricing.md"
      - "https://api.openalex.org/robots.txt"
    domain_whitelist:
      - "api.openalex.org"
    allowed_http_methods:
      - "GET"
    allowed_endpoints:
      - "https://api.openalex.org/works"
      - "https://api.openalex.org/works/{id}"
      - "https://api.openalex.org/authors"
      - "https://api.openalex.org/authors/{id}"
      - "https://api.openalex.org/sources"
      - "https://api.openalex.org/sources/{id}"
      - "https://api.openalex.org/institutions"
      - "https://api.openalex.org/institutions/{id}"
      - "https://api.openalex.org/publishers"
      - "https://api.openalex.org/publishers/{id}"
      - "https://api.openalex.org/funders"
      - "https://api.openalex.org/funders/{id}"
      - "https://api.openalex.org/topics"
      - "https://api.openalex.org/topics/{id}"
      - "https://api.openalex.org/rate-limit"
    rate_limits:
      requests_per_second: 10
      requests_per_minute: 600
      concurrency_limit: "not stated"
      polite_pool_rules: "Keyless casual use allows up to 10 requests per second. A free API key raises the rate limit to 30 requests per second and the daily budget 10× ($1/day free quota). Cursor paging is required for more than 10,000 results. No numeric concurrency limit is stated in the official documentation."
      paging_limits:
        per_page_max: 100
        basic_paging_max: 10000
    required_headers:
      user_agent: "TechPulse-AI/1.0 (https://github.com/techpulse; contact: info@techpulse.example.com)"
      mailto: "info@techpulse.example.com"
      extra_headers:
        Authorization: "Bearer <API_KEY> (optional for keyless; required when using key)"
    auth_needs: "None for keyless casual access; free API key supported via Authorization header or api_key query parameter"
    attribution: "OpenAlex data is CC0 public domain; citation and attribution to OpenAlex / POSI principles is standard scholarly best practice"
    caching_and_retention: "Permitted under CC0 public domain license; local caching and staging of metadata is supported"
    redistribution_rights: "CC0 1.0 Universal Public Domain Dedication ('the data is a public good, released under a CC0 public-domain license with no personal use only carve-out and no permission to ask')"
    prohibitions:
      - "Exceeding daily budget or rate limits (returns 429 Too Many Requests)"
      - "Inventing fake email addresses for API keys ('Ask your user for their email address; never invent one.')"
      - "Automated scraping of openalex.org search/list HTML web pages ('Search and list pages on openalex.org are not served to scripts.')"
    supporting_quotes:
      - "OpenAlex data is free, and so is casual use of the API — you can make basic queries with no key at all. To use the API at any real scale, though, you'll want a free API key: it raises your daily budget 10×, lets you track your usage, and is required for cursor paging past the first page."
      - "The API is plain GET requests, so you can test any query in your browser"
      - "Who’s calling: No API key -> Requests per second: 10; Free API key, or prepaid usage -> Requests per second: 30; Annual plan -> Requests per second: 50"
      - "Two things return 429 Too Many Requests: exceeding your daily budget, or sending requests faster than your per-second limit."
      - "Every response carries headers and a meta block showing where you stand: X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Credits-Used, X-RateLimit-Reset"
      - "Scholarly metadata is treated in most markets as 'the new oil' — value is captured by limiting access. OpenAlex takes the opposite position: the data is a public good, released under a CC0 public-domain license with no 'personal use only' carve-out and no permission to ask."
      - "Ask your user for their email address; never invent one."
      - "Search and list pages on openalex.org are not served to scripts. The API has more data and is faster"
      - "It’s free, and there are two ways to get one."
      - "We email the address a link titled “Activate your OpenAlex API key.” When the person clicks it, the key starts working, with a free account’s $1 a day."
      - "Individual queries also have hard limits: `per_page` maximum 100; `sample` maximum 10,000; basic paging limit 10,000 results."
      - "To retrieve more than 10,000 results, use cursor paging (with a free key: without one, only the first page works)."

