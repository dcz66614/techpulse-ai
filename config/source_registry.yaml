    rate_limits:
      requests_per_second: 10
      requests_per_minute: 600
      concurrency_limit: 3
      polite_pool_rules: "Official access table: Public pool rate limit 5, concurrency limit 1; Polite pool rate limit 10, concurrency limit 3; Metadata Plus rate limit 150, concurrency limit None. Rate limits are reported in the x-rate-limit-limit and x-rate-limit-interval response headers; concurrency limits in the x-concurrency-limit header."
      paging_limits:
        rows_max: 1000
        cursor_expiry_minutes: 5
    required_headers:
      user_agent: "TechPulse-AI/1.0 (mailto:info@techpulse.example.com)"
      mailto: "info@techpulse.example.com"
      extra_headers:
        Accept: "application/vnd.crossref-api-message+json"
    auth_needs: "None for public REST API polite pool; mailto identification required"
    attribution: "Documentation is CC BY 4.0; member bibliographic metadata is shared openly across the global community"
    caching_and_retention: "Permitted and explicitly recommended ('You might have a request that you want to make repeatedly and keep local results cached. You may even want to have a complete copy of the Crossref database and keep it up-to-date')"
    redistribution_rights: "All bibliographic metadata is openly shared with the global scholarly community through free APIs"
    prohibitions:
      - "Exceeding rate limits without exponential backoff on 429"
      - "Persistent failure to handle 429/403 blocks"
    supporting_quotes:
      - "Our publicly available REST API exposes the scholarly metadata that members and trusted sources deposit with Crossref. This bibliographic metadata and much more—you will find funding data, license information, post-publication updates, ORCID and ROR IDs, and abstracts. You can search, facet, filter, or sample metadata from dozens of thousands of members from all around the world, and the results are returned in JSON format."
      - "mailto: The email address to identify yourself and access the 'polite pool'"
      - "Use the polite pool: https://api.crossref.org/works?rows=0&mailto=yourmail@company.org"
      - "List requests return up to 1000 items in a single request. Paginating through multiple pages of results is possible using the cursor parameter... Cursors expire after 5 minutes if not used."
      - "Also pay attention to the http status code and back off if you start seeing 429 statuses, which means you are being rate limited."
      - "If you see a 429 or 403 response it means you have been temporarily or permanently blocked, in which case check the response text for details on how to proceed."
      - "You might have a request that you want to make repeatedly and keep local results cached. You may even want to have a complete copy of the Crossref database and keep it up-to-date"
      - "All this metadata is openly shared with the global scholarly community through our free APIs."
      - "Rate limits: These are included in the results headers under x-rate-limit-limit and x-rate-limit-interval and depend on the pool accessed by your request."
      - "Concurrent request limits: These limits restrict the number of simultaneous requests that can be made and are given in the x-concurrency-limit response header."
      - "The following limits apply: Pool Rate limit Concurrency limit Public 5 1 Polite 10 3 Plus 150 None"

