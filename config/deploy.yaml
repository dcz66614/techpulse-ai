# Deployment authorization (Ticket DEC, updated by owner decision 2026-11-18).
# Delegated decision by dispatcher on Cd's behalf (2026-10-29); target corrected 2026-11-18.

# AUTH-02: Local single-machine deployment on the owner's Windows PC.
# This is the environment validated by the smoke test and the 24h V99 soak run:
# scheduled tasks, local uvicorn (127.0.0.1) + soak runner, SQLite, Python via uv/venv,
# no Docker, no Postgres. The separate Linux target was never validated and was
# dropped by owner decision 2026-11-18. The host_platform value below describes the
# deployed host: the owner's Windows PC.
# Target: local only. SQLite database, local runner (uvicorn + O20 local orchestrator).
# No Docker, no Postgres, no cloud spend. Cloud / public deployment remains refused.
auth02:
  granted: true
  target: local
  host_platform: windows_x86_64
  python_runner: uv
  allowed_targets:
    - local
  prohibited_targets:
    - cloud
    - docker
    - postgres
    - public
  cloud_spend_cap_usd: 0.00
  database: sqlite
  runner: uvicorn_local_orchestrator
  network: localhost_only

# AUTH-06: Local/self-hosted "v1.0 local release" approval.
# Production gate means "local v1.0" only; anything public stays refused.
# No public outreach, no paid services.
auth06:
  granted: true
  scope: local_v1_0
  production_target: local_v1_0
  public_outreach: false
  paid_services: false

# V99 24-hour soak runner acceptance thresholds (Ticket DECfix / DECbox).
# PASS requires hourly cadence: >=24h wall-clock elapsed, >=23 successful cycles,
# and no cycle gap >2h (7200s) between successive cycles.
soak:
  target_hours: 24.0
  min_successful_cycles: 23
  max_cycle_gap_seconds: 7200.0  # 2 hours max gap between successive cycles
  p0_success_rate_threshold: 0.99
  max_cost_usd: 5.00
  interval_minutes: 60.0

