# Deployment authorization (Ticket DECbox, updating Ticket DEC).
# Delegated decision by dispatcher on Cd's behalf (2026-10-29); target updated per Ticket DECbox.

# AUTH-02: Local single-machine deployment on a separate always-on Linux machine
# (x86_64, Python via uv, no Docker, no Postgres), NOT the owner's Windows PC.
# Reason for change: the owner's PC shuts down nightly.
# Target: local only. SQLite database, local runner (uvicorn + O20 local orchestrator).
# No Docker, no Postgres, no cloud spend. Cloud / public deployment remains refused.
auth02:
  granted: true
  target: local
  host_platform: linux_x86_64
  python_runner: uv
  allowed_targets:
    - local
  prohibited_targets:
    - cloud
    - docker
    - postgres
    - public
  cloud_spend_cap_usd: 0.00
  database: sqlite
  runner: uvicorn_local_orchestrator
  network: localhost_only

# AUTH-06: Local/self-hosted "v1.0 local release" approval.
# Production gate means "local v1.0" only; anything public stays refused.
# No public outreach, no paid services.
auth06:
  granted: true
  scope: local_v1_0
  production_target: local_v1_0
  public_outreach: false
  paid_services: false
